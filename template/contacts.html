{% extends "base.html" %}

{% block title %}Contacts{% endblock %}

{% block body %}
<div class="container mb-4">
  <img alt="contact" src="static\contact-us1.png">
</div>
<div class="container pb-4">
  <h1 class="my-2 text-center">Contact us</h1>
  <form method="post" action="/contact">
  {% csrf_token %}
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" class="form-control" id="name" name="name" placeholder="enter your name">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="text" class="form-control" id="email" name="email" placeholder="enter your email">
    </div>

    <div class="form-group">
      <label for="phone">Contact</label>
      <input type="text" class="form-control" id="phone" name="phone" placeholder="enter your contact no">
    </div>

    <div class="form-group">
      <label for="desc">Description</label>
      <textarea class="form-control" id="desc" name="desc" placeholder="tell us what you want to reach out for"></textarea>
    </div>

    <button class="btn btn-primary mt-3" type="submit">Submit</button>
  
  </form>
</div>
{% endblock body %}
